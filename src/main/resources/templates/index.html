<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Distopia – Accueil</title>
</head>

<body>

<section layout:fragment="content">
    <!--hero -->
    <div class="py-5 text-center bg-dark text-white mb-5 hero-banner">

        <div class="container">

            <h1 class="display-4 fw-bold mb-3">
                Distopia
            </h1>

            <p class="lead text-white-50 mb-4">
                Trouvez un film, choisissez un cinéma, réservez vos places
            </p>

            <div class="d-flex justify-content-center flex-wrap gap-3">

                <a th:href="@{/movies}"
                   class="btn btn-danger btn-lg rounded-pill px-4">
                    <i class="bi bi-film me-2"></i>
                    Voir tous les films
                </a>

                <a th:href="@{/cinemas}"
                   class="btn btn-outline-light btn-lg rounded-pill px-4">
                    <i class="bi bi-camera-reels me-2"></i>
                    Nos cinémas
                </a>

            </div>

        </div>
    </div>

    <div class="container-fluid px-4 py-2">

        <!-- sorties de la semaine -->
        <div th:if="${not #lists.isEmpty(thisWeek)}"
             class="movie-section mb-5">

            <div class="section-header">
                <div>
                    <span class="section-subtitle">
                        Nouveautés
                    </span>

                    <h2 class="section-title">
                        Sorties cette semaine
                    </h2>
                </div>
            </div>

            <div class="movie-slider">
                <div th:each="m : ${thisWeek}"
                     class="movie-item">
                    <a th:href="@{/movies/{id}(id=${m.id})}"
                       class="text-decoration-none">
                        <div class="card movie-card border-0">
                            <div class="movie-poster-wrapper">
                                <img th:src="${m.posterPath != null ? imgBase + m.posterPath : '/images/cinemas/tickets.jpg'}"
                                     th:alt="${m.title}"
                                     class="movie-poster"
                                     loading="lazy"/>

                                <div class="movie-overlay"></div>
                                <div class="movie-play">
                                    <i class="bi bi-play-fill"></i>
                                </div>
                                <div class="movie-genre">
                                    <span class="badge text-dark bg-warning rounded-pill px-3 py-2"
                                          th:text="${m.genres}">
                                    </span>
                                </div>
                            </div>

                            <div class="card-body p-3">
                                <h5 class="movie-title"
                                    th:text="${m.title}">
                                </h5>
                                <div class="movie-date">
                                    <i class="bi bi-calendar3 me-1"></i>
                                    <span th:text="${m.releaseDate}"></span>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </div>

        <!-- à l'affiche (now playing)-->
        <div th:if="${not #lists.isEmpty(nowPlaying)}"
             class="movie-section mb-5">

            <div class="section-header">
                <div>
                    <span class="section-subtitle">
                        En salle
                    </span>

                    <h2 class="section-title">
                        À l'affiche
                    </h2>
                </div>
            </div>

            <div class="movie-slider">
                <div th:each="m : ${nowPlaying}"
                     class="movie-item">
                    <a th:href="@{/movies/{id}(id=${m.id})}"
                       class="text-decoration-none">
                        <div class="card movie-card border-0">
                            <div class="movie-poster-wrapper">
                                <img th:src="${imgBase + m.posterPath}"
                                     th:alt="${m.title}"
                                     class="movie-poster"
                                     loading="lazy"/>
                                <div class="movie-overlay"></div>

                                <div class="movie-play">
                                    <i class="bi bi-play-fill"></i>
                                </div>

                                <div class="movie-genre">
                                    <span class="badge text-dark bg-warning rounded-pill px-3 py-2"
                                          th:text="${m.genres}">
                                    </span>
                                </div>
                            </div>

                            <div class="card-body p-3">
                                <h5 class="movie-title"
                                    th:text="${m.title}">
                                </h5>
                                <div class="movie-date">
                                    <i class="bi bi-calendar3 me-1"></i>
                                    <span th:text="${m.releaseDate}"></span>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </div>

        <!-- prochainement (upcoming)-->
        <div th:if="${not #lists.isEmpty(upcoming)}"
             class="movie-section mb-5">

            <div class="section-header">
                <div>
                    <span class="section-subtitle">
                        Bientôt
                    </span>
                    <h2 class="section-title">
                        Prochainement
                    </h2>
                </div>
            </div>

            <div class="movie-slider">
                <div th:each="m : ${upcoming}"
                     class="movie-item">
                    <a th:href="@{/movies/{id}(id=${m.id})}"
                       class="text-decoration-none">
                        <div class="card movie-card border-0">
                            <div class="movie-poster-wrapper">
                                <img th:src="${imgBase + m.posterPath}"
                                     th:alt="${m.title}"
                                     class="movie-poster"
                                     loading="lazy"/>
                                <div class="movie-overlay"></div>

                                <div class="movie-play">
                                    <i class="bi bi-play-fill"></i>
                                </div>
                                <div class="movie-genre">
                                    <span class="badge text-dark bg-warning rounded-pill px-3 py-2"
                                          th:text="${m.genres}">
                                    </span>
                                </div>
                            </div>
                            <div class="card-body p-3">

                                <h5 class="movie-title"
                                    th:text="${m.title}">
                                </h5>
                                <div class="movie-date">
                                    <i class="bi bi-calendar3 me-1"></i>

                                    <span th:text="${m.releaseDate}"></span>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </div>

    </div>

    <style>

        body {
            background: #f4f6fb;
        }

        .hero-banner {
            background:
                    linear-gradient(
                            135deg,
                            #1a1a2e,
                            #16213e
                    );

            border-radius: 0 0 2rem 2rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: end;
            margin-bottom: 1.5rem;
        }

        .section-subtitle {
            color: #dc3545;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: .08em;
            font-size: .78rem;
        }

        .section-title {
            font-weight: 800;
            margin-bottom: 0;
            font-size: 2rem;
            color: #111827;
        }

        .movie-slider {
            display: flex;
            gap: 1.6rem;
            overflow-x: auto;
            padding-bottom: .5rem;
            scroll-snap-type: x mandatory;
        }

        .movie-slider::-webkit-scrollbar {
            height: 8px;
        }

        .movie-slider::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,.18);
            border-radius: 20px;
        }

        .movie-item {
            min-width: 260px;
            max-width: 260px;
            scroll-snap-align: start;
        }

        .movie-card {
            border-radius: 1.5rem;
            overflow: hidden;
            background: white;
            transition:
                    transform .35s ease,
                    box-shadow .35s ease;
        }

        .movie-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 1.2rem 2.5rem rgba(0,0,0,.14);
        }

        .movie-poster-wrapper {
            position: relative;
            overflow: hidden;
            height: 380px;
        }

        .movie-poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform .45s ease;
        }

        .movie-card:hover .movie-poster {
            transform: scale(1.08);
        }

        .movie-overlay {
            position: absolute;
            inset: 0;
            background:
                    linear-gradient(
                            to top,
                            rgba(0,0,0,.75),
                            rgba(0,0,0,.08)
                    );
            opacity: 0;
            transition: opacity .3s ease;
        }

        .movie-card:hover .movie-overlay {
            opacity: 1;
        }

        .movie-play {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all .3s ease;
        }

        .movie-play i {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background: rgba(255,255,255,.18);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2.2rem;
        }

        .movie-card:hover .movie-play {
            opacity: 1;
        }

        .movie-genre {
            position: absolute;
            top: 1rem;
            left: 1rem;
            z-index: 2;
        }

        .movie-title {
            font-weight: 700;
            color: #111827;
            margin-bottom: .6rem;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            min-height: 52px;
        }

        .movie-date {
            color: #6b7280;
            font-size: .95rem;
        }

        @media (max-width: 768px) {

            .movie-item {
                min-width: 220px;
                max-width: 220px;
            }

            .movie-poster-wrapper {
                height: 320px;
            }

            .section-title {
                font-size: 1.5rem;
            }
        }

    </style>

</section>

</body>
</html>
