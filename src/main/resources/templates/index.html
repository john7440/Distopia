<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Distopia – Accueil</title>
</head>

<body>
<section layout:fragment="content">

    <!-- hero -->
    <div class="py-5 text-center bg-dark text-white mb-5 hero-banner">

        <div class="container">

            <h1 class="display-4 fw-bold mb-3">
               Bienvenue sur Distopia
            </h1>

            <p class="lead text-white-50 mb-4">
                Trouvez un film, choisissez un cinéma, réservez vos places
            </p>

            <div class="d-flex justify-content-center flex-wrap gap-3">

                <a th:href="@{/movies}"
                   class="btn btn-danger btn-lg rounded-pill px-4">
                    <i class="bi bi-film me-2"></i>
                    Voir tous les films
                </a>

                <a th:href="@{/cinemas}"
                   class="btn btn-outline-light btn-lg rounded-pill px-4">
                    <i class="bi bi-camera-reels me-2"></i>
                    Nos cinémas
                </a>
            </div>
        </div>
    </div>

    <div class="container-fluid px-4 py-2">

        <!-- à l'affiche -->
        <div th:if="${not #lists.isEmpty(nowPlaying)}"
             class="movie-section mb-5">

            <div class="section-header enhanced-header">

                <div>
                    <span class="section-subtitle">
                        En salle
                    </span>
                    <h2 class="section-title">
                        À l'affiche
                    </h2>
                </div>
                <div class="section-actions">
                    <a th:href="@{/movies}"
                       class="see-all-link">
                        Voir tout
                    </a>
                    <div class="slider-controls">
                        <button type="button"
                                class="slider-btn"
                                onclick="scrollSlider('nowPlayingSlider', -1)"
                                aria-label="défiler à gauche">
                            <i class="bi bi-arrow-left"></i>
                        </button>
                        <button type="button"
                                class="slider-btn"
                                onclick="scrollSlider('nowPlayingSlider', 1)"
                                aria-label="défiler à droite">
                            <i class="bi bi-arrow-right"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="movie-slider custom-slider"
                 id="nowPlayingSlider">
                <div th:each="m : ${nowPlaying}"
                     class="movie-item">
                    <a th:href="@{/movie/tmdb/{tmdbId}(tmdbId=${m.id})}"
                       class="text-decoration-none">

                        <div class="card movie-card border-0">
                            <div class="movie-poster-wrapper">
                                <img th:src="${m.posterPath != null ? imgBase + m.posterPath : '/images/no-poster.jpg'}"
                                     th:alt="${m.title}"
                                     class="movie-poster"
                                     loading="lazy"/>

                                <div class="movie-overlay"></div>

                                <div class="movie-play">
                                    <i class="bi bi-play-fill"></i>
                                </div>

                            </div>

                            <div class="card-body p-3">
                                <h5 class="movie-title"
                                    th:text="${m.title}">Titre du film
                                </h5>
                                <div class="movie-date">
                                    <i class="bi bi-calendar3 me-1"></i>
                                    <span th:text="${m.releaseDate}"></span>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </div>

        <!-- prochainement -->
        <div th:if="${not #lists.isEmpty(upcoming)}"
             class="movie-section mb-5">

            <div class="section-header enhanced-header">

                <div>
                    <span class="section-subtitle">
                        Bientôt
                    </span>

                    <h2 class="section-title">
                        Prochainement
                    </h2>
                </div>

                <div class="section-actions">
                    <a th:href="@{/movies}"
                       class="see-all-link">
                        Voir tout
                    </a>
                    <div class="slider-controls">
                        <button type="button"
                                class="slider-btn"
                                onclick="scrollSlider('upcomingSlider', -1)"
                                aria-label="défiler à gauche">
                            <i class="bi bi-arrow-left"></i>
                        </button>
                        <button type="button"
                                class="slider-btn"
                                onclick="scrollSlider('upcomingSlider', 1)"
                                aria-label="défiler à droite">
                            <i class="bi bi-arrow-right"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="movie-slider custom-slider"
                 id="upcomingSlider">

                <div th:each="m : ${upcoming}"
                     class="movie-item">

                    <a th:href="@{/movie/tmdb/{tmdbId}(tmdbId=${m.id})}"
                       class="text-decoration-none">
                        <div class="card movie-card border-0">
                            <div class="movie-poster-wrapper">
                                <img th:src="${m.posterPath != null ? imgBase + m.posterPath : '/images/no-poster.jpg'}"
                                     th:alt="${m.title}"
                                     class="movie-poster"
                                     loading="lazy"/>

                                <div class="movie-overlay"></div>

                                <div class="movie-play">
                                    <i class="bi bi-play-fill"></i>
                                </div>

                            </div>
                            <div class="card-body p-3">

                                <h5 class="movie-title"
                                    th:text="${m.title}">Titre du film
                                </h5>
                                <div class="movie-date">
                                    <i class="bi bi-calendar3 me-1"></i>
                                    <span th:text="${m.releaseDate}"></span>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function scrollSlider(sliderId, direction) {
            const slider = document.getElementById(sliderId);

            if (!slider) {
                return;
            }

            const scrollAmount = slider.clientWidth * 0.85;

            slider.scrollBy({
                left: direction * scrollAmount,
                behavior: 'smooth'
            });
        }
    </script>

</section>

</body>
</html>
