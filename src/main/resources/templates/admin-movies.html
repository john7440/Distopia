<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<div layout:fragment="content">

    <div class="container py-4">

        <!-- header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">
                <i class="bi bi-film"></i>
                Gestion des films
            </h2>

            <a th:href="@{/admin/import-movies}"
               class="btn btn-success">

                <i class="bi bi-cloud-download"></i>
                Importer TMDB
            </a>
        </div>

        <!-- flash msg-->
        <div th:if="${message}"
             class="alert alert-success alert-dismissible fade show">

            <span th:text="${message}"></span>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
            </button>
        </div>

        <!-- Search  -->
        <form th:action="@{/admin/movies}"
              method="get"
              class="row g-3 mb-4">

            <div class="col-md-10">

                <input type="text"
                       name="keyword"
                       class="form-control"
                       placeholder="Rechercher un film..."
                       th:value="${keyword}">
            </div>

            <div class="col-md-2 d-grid">

                <button class="btn btn-dark">
                    <i class="bi bi-search"></i>
                    Rechercher
                </button>
            </div>

        </form>

        <!--resume -->
        <div class="mb-3 text-muted small">

            <span th:text="${moviePage.totalElements}"></span>
            film(s) - page
            <span th:text="${currentPage + 1}"></span>

            /

            <span th:text="${moviePage.totalPages > 0 ? moviePage.totalPages : 1}"></span>

        </div>

        <!-- table -->
        <div class="card shadow-sm border-0">

            <div class="card-body p-0">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-dark">

                    <tr>
                        <th style="width:80px"></th>
                        <th>Titre</th>
                        <th>Genre</th>
                        <th>Durée</th>
                        <th>Cinémas</th>
                        <th>Statut</th>
                        <th class="text-center" style="width:180px">Actions</th>
                    </tr>

                    </thead>

                    <tbody>

                    <!-- if empty -->
                    <tr th:if="${#lists.isEmpty(movies)}">
                        <td colspan="7"
                            class="text-center py-5 text-muted">
                            <i class="bi bi-film fs-1 d-block mb-2"></i>
                            Aucun film trouvé
                        </td>
                    </tr>

                    <!-- movies -->
                    <tr th:each="m : ${movies}">
                        <!-- affiches -->
                        <td>
                            <img th:if="${m.imageUrl != null}"
                                 th:src="${m.imageUrl}"
                                 th:alt="${m.title}"
                                 style="width:50px;
                                        height:70px;
                                        object-fit:cover;
                                        border-radius:6px;">

                            <div th:if="${m.imageUrl == null}"
                                 class="bg-secondary text-white d-flex
                                        align-items-center justify-content-center"
                                 style="width:50px;
                                        height:70px;
                                        border-radius:6px;">

                                <i class="bi bi-film"></i>
                            </div>
                        </td>
                        <!-- titles -->
                        <td>
                            <div class="fw-semibold"
                                 th:text="${m.title}">
                            </div>

                            <div th:if="${m.trailerUrl != null}"
                                 class="mt-1">

                                <a th:href="${m.trailerUrl}" target="_blank"
                                   class="badge bg-danger text-decoration-none">
                                    <i class="bi bi-youtube"></i>
                                    Trailer
                                </a>
                            </div>
                        </td>
                        <!-- genre -->
                        <td>

                            <span class="badge bg-secondary"
                                  th:text="${m.genre}">
                            </span>
                        </td>
                        <!-- duration -->
                        <td th:text="${m.duration > 0 ? m.duration + ' min' : '—'}">
                        </td>

                        <!--cinemas -->
                        <td>
                            <span th:if="${m.cinemas.isEmpty()}"
                                  class="text-muted">
                                —
                            </span>

                            <span th:each="c : ${m.cinemas}"
                                  class="badge bg-light text-dark border me-1"
                                  th:text="${c.name}">
                            </span>
                        </td>

                        <!-- status -->
                        <td>
                            <span th:if="${!m.deleted}"
                                  class="badge bg-success">Actif
                            </span>

                            <span th:if="${m.deleted}"
                                  class="badge bg-danger">Supprimé
                            </span>

                        </td>
                        <!-- --------------------------ACTIONS--------------------------------->
                        <td>
                            <!-- edit -->
                            <button class="btn btn-warning btn-sm"
                                    data-bs-toggle="modal"
                                    th:data-bs-target="'#editMovieModal' + ${m.id}"> Modifier
                            </button>

                            <!-- del -->
                            <a th:href="@{/admin/deleteMovie(id=${m.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Supprimer ce film ?')"> Supprimer
                            </a>

                            <!-----------------------------------------EDIT MODAL------------------------------->
                            <div class="modal fade"
                                 th:id="'editMovieModal' + ${m.id}"
                                 tabindex="-1">

                                <div class="modal-dialog modal-lg">
                                    <div class="modal-content">
                                        <form method="post"
                                              th:action="@{/admin/saveMovie}">

                                            <div class="modal-header">
                                                <h5 class="modal-title">Modifier le film</h5>

                                                <button type="button"
                                                        class="btn-close"
                                                        data-bs-dismiss="modal">
                                                </button>

                                            </div>

                                            <div class="modal-body">
                                                <input type="hidden" name="id"
                                                       th:value="${m.id}">

                                                <div class="row g-3">
                                                    <!-- titre-->
                                                    <div class="col-md-6">
                                                        <label class="form-label">Titre</label>

                                                        <input type="text" name="title"
                                                               class="form-control"
                                                               th:value="${m.title}"
                                                               required>
                                                    </div>

                                                    <!-- genre -->
                                                    <div class="col-md-6">

                                                        <label class="form-label">Genre</label>

                                                        <input type="text"
                                                               name="genre"
                                                               class="form-control"
                                                               th:value="${m.genre}">

                                                    </div>

                                                    <!-- durée -->
                                                    <div class="col-md-4">

                                                        <label class="form-label">Durée</label>
                                                        <input type="number"
                                                               name="duration"
                                                               class="form-control"
                                                               th:value="${m.duration}">
                                                    </div>

                                                    <!-- image -->
                                                    <div class="col-md-8">

                                                        <label class="form-label">Image URL</label>

                                                        <input type="text"
                                                               name="imageUrl"
                                                               class="form-control"
                                                               th:value="${m.imageUrl}">
                                                    </div>

                                                    <!-- le trailer -->
                                                    <div class="col-12">
                                                        <label class="form-label">Trailer URL</label>

                                                        <input type="text" name="trailerUrl"
                                                               class="form-control"
                                                               th:value="${m.trailerUrl}">
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="modal-footer">

                                                <button type="button"
                                                        class="btn btn-danger"
                                                        data-bs-dismiss="modal">
                                                    Annuler
                                                </button>

                                                <button class="btn btn-success">
                                                    Sauvegarder
                                                </button>

                                            </div>
                                        </form>

                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!--------------------------- PAGINATION --------------------------->
        <nav class="mt-4"
             th:if="${moviePage.totalPages > 1}">

            <ul class="pagination justify-content-center">

                <!-- PREV -->
                <li class="page-item"
                    th:classappend="${currentPage == 0} ? 'disabled'">

                    <a class="page-link"
                       th:href="@{/admin/movies(
                       page=${currentPage - 1},
                       keyword=${keyword})}">

                        &laquo;

                    </a>

                </li>

                <!-- WINDOW PAGINATION -->
                <li class="page-item"

                    th:each="i : ${#numbers.sequence(
                    currentPage > 2 ? currentPage - 2 : 0,
                    currentPage + 2 < moviePage.totalPages - 1 ?
                    currentPage + 2 :
                    moviePage.totalPages - 1)}"

                    th:classappend="${i == currentPage} ? 'active'">

                    <a class="page-link"
                       th:text="${i + 1}"

                       th:href="@{/admin/movies(
                       page=${i},
                       keyword=${keyword})}">
                    </a>

                </li>

                <!-- NEXT -->
                <li class="page-item"

                    th:classappend="${currentPage >= moviePage.totalPages - 1}
                    ? 'disabled'">

                    <a class="page-link" th:href="@{/admin/movies(
                       page=${currentPage + 1},
                       keyword=${keyword})}">
                        &raquo;
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</div>

</html>
