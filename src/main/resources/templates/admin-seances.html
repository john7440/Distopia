<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<title>Distopia - admin-seances</title>

<div layout:fragment="content">

    <div class="container py-4">

        <!-- header -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="fw-bold">
                <i class="bi bi-calendar3"></i> Gestion des séances
            </h2>

            <button type="button"
                    class="btn btn-success"
                    data-bs-toggle="modal"
                    data-bs-target="#addSeanceModal">
                <i class="bi bi-plus"></i> Ajouter une séance
            </button>

        </div>

        <div th:if="${message}"
             class="alert alert-success alert-dismissible fade show">
            <span th:text="${message}"></span>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
            </button>
        </div>

        <div th:if="${warning}"
             class="alert alert-warning alert-dismissible fade show">
            <span th:text="${warning}"></span>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
            </button>
        </div>

        <div th:if="${error}"
             class="alert alert-danger alert-dismissible fade show">
            <span th:text="${error}"></span>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
            </button>
        </div>

        <!-- search-->
        <form method="get"
              th:action="@{/admin/seances}"
              class="row g-3 mb-4">

            <div class="col-md-4">
                <label for="movieSearch" class="visually-hidden">Rechercher un cinéma</label>
                <input id="movieSearch" type="text"
                       name="keyword"
                       class="form-control"
                       placeholder="Rechercher un film..."
                       th:value="${keyword}">
            </div>

            <!-- cinemas -->
            <div class="col-md-4">
                <label for="selectCinema" class="visually-hidden">Sélectionner un cinéma</label>
                <select id="selectCinema" name="cinemaId"
                        class="form-select">
                    <option value="">
                        Tous les cinémas
                    </option>
                    <option th:each="c : ${cinemas}"
                            th:value="${c.id}"
                            th:text="${c.name}"
                            th:selected="${cinemaId == c.id}">
                    </option>
                </select>
            </div>

            <!-- archived -->
            <div class="col-md-2 d-flex align-items-center">

                <div class="form-check">

                    <input class="form-check-input"
                           type="checkbox"
                           name="showArchived"
                           value="true"
                           id="showArchived"
                           th:checked="${showArchived}">

                    <label class="form-check-label"
                           for="showArchived">
                        Archivées
                    </label>

                </div>

            </div>

            <!-- search btn -->
            <div class="col-md-2 d-grid">
                <button class="btn btn-dark">
                    <i class="bi bi-search"></i>
                    Rechercher
                </button>
            </div>
        </form>

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">

            <div class="text-muted small">

                <span th:text="${seancePage.totalElements}"></span>
                séance(s) - page
                <span th:text="${currentPage + 1}"></span>
                /
                <span th:text="${seancePage.totalPages > 0 ?
                                seancePage.totalPages : 1}">
                </span>
            </div>

            <div class="d-flex gap-2 flex-wrap">

                <form id="deleteSelectedSeancesForm"
                      th:action="@{/admin/deleteSelectedSeances}"
                      method="post"
                      class="d-inline">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <input type="hidden" name="keyword" th:value="${keyword}">
                    <input type="hidden" name="cinemaId" th:value="${cinemaId}">
                    <input type="hidden" name="showArchived" th:value="${showArchived}">
                    <input type="hidden" name="sortField" th:value="${sortField}">
                    <input type="hidden" name="sortDir" th:value="${sortDir}">

                    <button type="submit"
                            class="btn btn-danger btn-sm"
                            onclick="return confirm('Supprimer les séances sélectionnées ?')">
                        <i class="bi bi-trash"></i> Supprimer la sélection
                    </button>
                </form>

                <form th:action="@{/admin/deleteFilteredSeances}"
                      method="post"
                      class="d-inline">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <input type="hidden" name="keyword" th:value="${keyword}">
                    <input type="hidden" name="cinemaId" th:value="${cinemaId}">
                    <input type="hidden" name="showArchived" th:value="${showArchived}">
                    <input type="hidden" name="sortField" th:value="${sortField}">
                    <input type="hidden" name="sortDir" th:value="${sortDir}">

                    <button type="submit"
                            class="btn btn-outline-danger btn-sm"
                            onclick="return confirm('Supprimer toutes les séances correspondant aux filtres actuels ? Cette action est irréversible.')">
                        <i class="bi bi-exclamation-triangle"></i> Supprimer les résultats filtrés
                    </button>
                </form>

            </div>
        </div>

        <!-- table-->
        <div class="card border-0 shadow-sm">

            <div class="card-body p-0">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-dark">

                    <tr>
                        <th>
                            <input type="checkbox" id="selectAllSeances">
                            <label for="selectAllSeances" class="visually-hidden">Sélectionner toutes les séances</label>
                        </th>
                        <th>ID</th>
                        <th>Film</th>
                        <th>Cinéma</th>
                        <th>
                            <a th:href="@{/admin/seances(
                                keyword=${keyword},
                                cinemaId=${cinemaId},
                                showArchived=${showArchived},
                                page=0,
                                sortField='dateTime',
                                sortDir=${sortField == 'dateTime' ? reverseSortDir : 'asc'})}"
                               class="text-white text-decoration-none d-flex align-items-center gap-1">
                                Date
                                <i th:if="${sortField == 'dateTime'}"
                                   class="bi ms-1"
                                   th:classappend="${sortDir == 'asc'} ? 'bi-caret-up-fill' : 'bi-caret-down-fill'">
                                </i>
                                <i th:if="${sortField != 'dateTime'}"
                                   class="bi bi-chevron-expand ms-1 opacity-50">
                                </i>
                            </a>
                        </th>
                        <th>Places</th>
                        <th>Prix</th>
                        <th>Statut</th>
                        <th class="text-center" style="width:180px">Actions</th>
                    </tr>

                    </thead>

                    <tbody>

                    <!-- if empty -->
                    <tr th:if="${#lists.isEmpty(seances)}">

                        <td colspan="9"
                            class="text-center py-5 text-muted">
                            <i class="bi bi-calendar-event fs-1 d-block mb-2"></i>
                            Aucune séance trouvée
                        </td>

                    </tr>

                    <!-- seances----->
                    <tr th:each="s : ${seances}">
                        <td>
                            <input id="selectIds" type="checkbox"
                                   name="selectedIds"
                                   th:value="${s.id}"
                                   form="deleteSelectedSeancesForm"
                                   class="seance-checkbox">
                            <label for="selectIds" class="visually-hidden">Sélectionner séances</label>
                        </td>

                        <td th:text="${s.id}"></td>
                        <!-- movie -->
                        <td>
                            <div class="fw-semibold"
                                 th:text="${s.movie.title}">
                            </div>

                            <div class="small text-muted"
                                 th:text="${s.movie.genre}">
                            </div>
                        </td>

                        <!-- cinema -->
                        <td th:text="${s.cinema.name}"></td>

                        <!-- date -->
                        <td>
                            <span th:text="${#temporals.format(
                                  s.dateTime,
                                  'dd/MM/yyyy HH:mm')}">
                            </span>
                        </td>
                        <!-- Seats -->
                        <td th:text="${s.availableSeats}"></td>

                        <!--price -->
                        <td>
                            <span th:text="${s.price + ' €'}"></span>
                        </td>

                        <!-- status -->
                        <td>
                            <span th:if="${s.active}" class="badge bg-success">
                                Active
                            </span>
                            <span th:if="${!s.active}" class="badge bg-secondary">
                                Archivée
                            </span>
                        </td>

                        <!-- actions -->
                        <td>
                            <!--edit button -->
                            <button class="btn btn-warning btn-sm"
                                    data-bs-toggle="modal"
                                    th:data-bs-target="'#editSeanceModal' + ${s.id}">
                                Modifier
                            </button>

                            <!-- delete -->
                            <form th:action="@{/admin/deleteSeance}" method="post" class="d-inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="id" th:value="${s.id}" />
                                <button type="submit"
                                        class="btn btn-danger btn-sm"
                                        onclick="return confirm('Supprimer cette séance ?')">
                                    Supprimer
                                </button>
                            </form>

                            <!-----------------------------MODAL EDIT--------------------------->
                            <div class="modal fade"
                                 th:id="'editSeanceModal' + ${s.id}"
                                 tabindex="-1">

                                <div class="modal-dialog modal-lg">

                                    <div class="modal-content">

                                        <form method="post" th:action="@{/admin/saveSeance}">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                            <!-- header -->
                                            <div class="modal-header">

                                                <h5 class="modal-title">Modifier la séance</h5>

                                                <button type="button"
                                                        class="btn-close"
                                                        data-bs-dismiss="modal">
                                                </button>
                                            </div>

                                            <!-- body -->
                                            <div class="modal-body">

                                                <input type="hidden"
                                                       name="id"
                                                       th:value="${s.id}">

                                                <div class="row g-3">
                                                    <!-- movie-->
                                                    <div class="col-md-6">

                                                        <label for="seanceMovie" class="form-label">Film</label>
                                                        <select id="seanceMovie" name="movieId"
                                                                class="form-select"
                                                                required>

                                                            <option th:each="m : ${movies}"
                                                                    th:value="${m.id}"
                                                                    th:text="${m.title}"
                                                                    th:selected="${m.id == s.movie.id}">
                                                            </option>

                                                        </select>

                                                    </div>

                                                    <!-- cinemas -->
                                                    <div class="col-md-6">
                                                        <label for="seanceCinema" class="form-label">Cinéma</label>
                                                        <select id="seanceCinema" name="cinemaId"
                                                                class="form-select"
                                                                required>

                                                            <option th:each="c : ${cinemas}"
                                                                    th:value="${c.id}"
                                                                    th:text="${c.name}"
                                                                    th:selected="${c.id == s.cinema.id}">
                                                            </option>

                                                        </select>

                                                    </div>

                                                    <!-- Date -->
                                                    <div class="col-md-6">
                                                        <label for="seanceDate" class="form-label">Date</label>
                                                        <input id="seanceDate" type="datetime-local"
                                                               name="dateTime"
                                                               class="form-control"
                                                               th:value="${#temporals.format(
                                                               s.dateTime,
                                                               'yyyy-MM-dd''T''HH:mm')}"
                                                               required>

                                                    </div>

                                                    <!-- seats-->
                                                    <div class="col-md-3">
                                                        <label for="seanceSeats" class="form-label">Places</label>
                                                        <input id="seanceSeats" type="number"
                                                               name="availableSeats"
                                                               class="form-control"
                                                               th:value="${s.availableSeats}"
                                                               min="1"
                                                               max="500"
                                                               required>
                                                    </div>

                                                    <!-- the price -->
                                                    <div class="col-md-3">
                                                        <label for="seancePrice" class="form-label">Prix</label>
                                                        <input id="seancePrice" type="number"
                                                               step="0.01"
                                                               name="price"
                                                               class="form-control"
                                                               th:value="${s.price}"
                                                               min="0.01"
                                                               required>
                                                    </div>
                                                </div>

                                            </div>

                                            <!-- modal footer -->
                                            <div class="modal-footer">

                                                <button type="button"
                                                        class="btn btn-danger"
                                                        data-bs-dismiss="modal">Annuler
                                                </button>

                                                <button class="btn btn-success">Sauvegarder</button>

                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!---------------------------- PAGINATION ------------------------------>
        <nav class="mt-4"
             th:if="${seancePage.totalPages > 1}">

            <ul class="pagination justify-content-center flex-wrap">

                <!-- first page -->
                <li class="page-item"
                    th:classappend="${currentPage == 0} ? 'disabled'">

                    <a class="page-link"
                       th:href="@{/admin/seances(
                   page=0,
                   keyword=${keyword},
                   cinemaId=${cinemaId},
                   showArchived=${showArchived},
                   sortField=${sortField},
                   sortDir=${sortDir})}">
                        «
                    </a>
                </li>

                <!-- previous page -->
                <li class="page-item"
                    th:classappend="${currentPage == 0} ? 'disabled'">

                    <a class="page-link"
                       th:href="@{/admin/seances(
                   page=${currentPage - 1},
                   keyword=${keyword},
                   cinemaId=${cinemaId},
                   showArchived=${showArchived},
                   sortField=${sortField},
                   sortDir=${sortDir})}">
                        ‹
                    </a>
                </li>

                <!-- first visible page -->
                <li th:if="${currentPage > 3}"
                    class="page-item">

                    <a class="page-link"
                       th:href="@{/admin/seances(
                               page=0,
                               keyword=${keyword},
                               cinemaId=${cinemaId},
                               showArchived=${showArchived},
                               sortField=${sortField},
                               sortDir=${sortDir})}">1
                    </a>
                </li>

                <!-- left ellipsis -->
                <li th:if="${currentPage > 4}"
                    class="page-item disabled">
                    <span class="page-link">...</span>
                </li>

                <!-- page window -->
                <li th:each="i : ${#numbers.sequence(
                        currentPage > 2 ? currentPage - 2 : 0,
                        currentPage + 2 < seancePage.totalPages - 1 ?
                        currentPage + 2 :
                        seancePage.totalPages - 1)}"
                    class="page-item"
                    th:classappend="${i == currentPage} ? 'active'">

                    <a class="page-link"
                       th:text="${i + 1}"
                       th:href="@{/admin/seances(
                           page=${i},
                           keyword=${keyword},
                           cinemaId=${cinemaId},
                           showArchived=${showArchived},
                           sortField=${sortField},
                           sortDir=${sortDir})}">
                    </a>
                </li>

                <!-- right ellipsis -->
                <li th:if="${currentPage < seancePage.totalPages - 5}"
                    class="page-item disabled">
                    <span class="page-link">...</span>
                </li>

                <!-- last visible page -->
                <li th:if="${currentPage < seancePage.totalPages - 4}"
                    class="page-item">

                    <a class="page-link"
                       th:text="${seancePage.totalPages}"
                       th:href="@{/admin/seances(
                           page=${seancePage.totalPages - 1},
                           keyword=${keyword},
                           cinemaId=${cinemaId},
                           showArchived=${showArchived},
                           sortField=${sortField},
                           sortDir=${sortDir})}">
                    </a>
                </li>

                <!-- next page -->
                <li class="page-item"
                    th:classappend="${currentPage >= seancePage.totalPages - 1} ? 'disabled'">

                    <a class="page-link"
                       th:href="@{/admin/seances(
                           page=${currentPage + 1},
                           keyword=${keyword},
                           cinemaId=${cinemaId},
                           showArchived=${showArchived},
                           sortField=${sortField},
                           sortDir=${sortDir})}">
                        ›
                    </a>
                </li>

                <!-- last page -->
                <li class="page-item"
                    th:classappend="${currentPage >= seancePage.totalPages - 1} ? 'disabled'">

                    <a class="page-link"
                       th:href="@{/admin/seances(
                           page=${seancePage.totalPages - 1},
                           keyword=${keyword},
                           cinemaId=${cinemaId},
                           showArchived=${showArchived},
                           sortField=${sortField},
                           sortDir=${sortDir})}">
                        »
                    </a>
                </li>
            </ul>
        </nav>
    </div>

    <!---------------------------------------ADD MODAL-------->
    <div class="modal fade"
         id="addSeanceModal"
         tabindex="-1">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <form method="post" th:action="@{/admin/saveSeance}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <!-- header -->
                    <div class="modal-header">
                        <h5 class="modal-title">
                            <i class="bi bi-plus-circle"></i>
                            Ajouter une séance
                        </h5>

                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="modal">
                        </button>
                    </div>

                    <!-- body -->
                    <div class="modal-body">
                        <div class="row g-3">

                            <!-- movie -->
                            <div class="col-md-6">

                                <label for="selectMovies" class="form-label">Film</label>
                                <select id="selectMovies" name="movieId"
                                        class="form-select"
                                        required>

                                    <option value="">-- Choisir un film --</option>
                                    <option th:each="m : ${movies}"
                                            th:value="${m.id}"
                                            th:text="${m.title}">
                                    </option>

                                </select>
                            </div>

                            <!-- Cinema -->
                            <div class="col-md-6">
                                <label for="selectCinemasIds" class="form-label">Cinéma</label>
                                <select id="selectCinemasIds" name="cinemaId"
                                        class="form-select"
                                        required>

                                    <option value="">-- Choisir un cinéma --</option>

                                    <option th:each="c : ${cinemas}"
                                            th:value="${c.id}"
                                            th:text="${c.name}">
                                    </option>
                                </select>
                            </div>

                            <!-- date -->
                            <div class="col-md-6">

                                <label for="selectDate" class="form-label">Date</label>
                                <input id="selectDate" type="datetime-local"
                                       name="dateTime"
                                       class="form-control"
                                       required>
                            </div>

                            <!-- Seats -->
                            <div class="col-md-3">
                                <label for="selectSeats" class="form-label">Places</label>
                                <input id="selectSeats" type="number"
                                       name="availableSeats"
                                       class="form-control"
                                       min="1"
                                       max="500"
                                       required>
                            </div>

                            <!-- price-->
                            <div class="col-md-3">
                                <label for="selectPrice" class="form-label">Prix</label>
                                <input id="selectPrice" type="number"
                                       step="0.01"
                                       name="price"
                                       class="form-control"
                                       min="0.01"
                                       required>
                            </div>
                        </div>
                    </div>

                    <!-- modal footer-->
                    <div class="modal-footer">

                        <button type="button"
                                class="btn btn-danger"
                                data-bs-dismiss="modal">Annuler
                        </button>

                        <button class="btn btn-success">
                            <i class="bi bi-save"></i>
                            Sauvegarder
                        </button>

                    </div>
                </form>
            </div>
        </div>
    </div>
    <script th:src="@{/js/admin-seances.js}"></script>
</div>

</html>
