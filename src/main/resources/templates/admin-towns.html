<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Distopia - Gestion des villes</title>
</head>

<body>

<section layout:fragment="content">

    <div class="container py-4">

        <!-- header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold mb-0">
                <i class="bi bi-building text-dark"></i>
                Gestion des villes
            </h3>

            <!--add btn -->
            <button class="btn btn-success"
                    data-bs-toggle="modal"
                    data-bs-target="#addTownModal">
                <i class="bi bi-plus-lg me-1"></i>
                Ajouter une ville
            </button>
        </div>

        <div th:if="${message}"
             class="alert alert-success alert-dismissible fade show">
            <span th:text="${message}"></span>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
            </button>
        </div>

        <div th:if="${error}"
             class="alert alert-danger alert-dismissible fade show">
            <span th:text="${error}"></span>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
            </button>
        </div>

        <!-- table-->
        <div class="table-container">

            <table class="table table-hover align-middle mb-0">

                <thead class="table-dark">
                <tr>
                    <th style="width:90px">#</th>
                    <th>Ville</th>
                    <th>Cinémas</th>
                    <th class="text-center"style="width:180px">Actions</th>
                </tr>
                </thead>

                <tbody>

                <!-- empty -->
                <tr th:if="${towns.isEmpty()}">
                    <td colspan="4"
                        class="text-center text-muted py-5">
                        <i class="bi bi-building fs-2 d-block mb-2 opacity-50"></i>
                        Aucune ville enregistrée
                    </td>
                </tr>

                <!-- rows -->
                <tr th:each="town : ${towns}">
                    <td class="text-muted small"
                        th:text="${town.id}">
                    </td>
                    <td>
                        <span class="fw-semibold"
                              th:text="${town.name}">
                        </span>
                    </td>
                    <td>
                        <span class="badge bg-secondary"
                              th:text="${town.cinemas.size()} + ' cinéma(s)'">
                        </span>
                    </td>

                    <td class="text-end">

                        <!-- edit -->
                        <a th:href="@{/admin/towns(editId=${town.id})}"
                           class="btn btn-sm btn-warning me-1">
                            Modifier
                        </a>

                        <!-- delete -->
                        <form th:action="@{/admin/deleteTown}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="id" th:value="${town.id}" />
                            <button type="submit"
                                    class="btn btn-sm btn-danger"
                                    onclick="return confirm('Supprimer cette ville ? Les cinémas associés perdront leur ville')">
                                Supprimer
                            </button>
                        </form>

                    </td>

                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- -----------------------ADD MODAL------------------------->

    <div class="modal fade"
         id="addTownModal"
         tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <form th:action="@{/admin/saveTown}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <div class="modal-header">
                        <h5 class="modal-title fw-bold">
                            <i class="bi bi-plus-circle me-2"></i>
                            Ajouter une ville
                        </h5>

                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="modal">
                        </button>
                    </div>

                    <div class="modal-body">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Nom de la ville
                            </label>

                            <input type="text"
                                   name="name"
                                   class="form-control"
                                   placeholder="Ex : Lyon"
                                   minlength="2"
                                   maxlength="100"
                                   required>
                        </div>
                    </div>

                    <div class="modal-footer">

                        <button type="button"
                                class="btn btn-danger"
                                data-bs-dismiss="modal">Annuler
                        </button>

                        <button type="submit"
                                class="btn btn-success">
                            <i class="bi bi-save me-1"></i>Ajouter
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!---------------------------------------- EDIT MODAL-------------->

    <div class="modal fade"
         id="editTownModal"
         tabindex="-1"
         th:classappend="${editTown != null} ? 'show d-block' : ''"
         th:style="${editTown != null} ? 'background:rgba(0,0,0,.5)' : ''">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <form th:action="@{/admin/saveTown}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden"
                           name="id"
                           th:value="${editTown != null ? editTown.id : ''}">

                    <div class="modal-header">
                        <h5 class="modal-title fw-bold">
                            <i class="bi bi-pencil-square me-2"></i> Modifier la ville
                        </h5>

                        <button type="button"
                                class="btn-close"
                                aria-label="Fermer"
                                th:onclick="|window.location.href='@{/admin/towns}'|">
                        </button>

                    </div>

                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nom de la ville</label>

                            <input type="text"
                                   name="name"
                                   class="form-control"
                                   th:value="${editTown != null ? editTown.name : ''}"
                                   minlength="2"
                                   maxlength="100"
                                   required>
                        </div>

                    </div>

                    <div class="modal-footer">

                        <a th:href="@{/admin/towns}"
                           class="btn btn-danger">Annuler
                        </a>

                        <button type="submit"
                                class="btn btn-success">
                                <i class="bi bi-save me-1"></i> Modifier
                        </button>

                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

</body>
</html>
