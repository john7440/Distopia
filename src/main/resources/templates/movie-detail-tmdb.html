<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${tmdbMovie.title} + ' – Distopia'">Film – Distopia</title>
</head>
<body>
<section layout:fragment="content">
    <div class="container py-4" th:if="${tmdbMovie != null}">

        <a href="/" class="btn btn-outline-danger btn-sm mb-4">
            <i class="bi bi-arrow-left"></i> Retour</a>

        <div class="row g-4">

            <!--affiche -->
            <div class="col-md-3">
                <img th:src="${imgBase + tmdbMovie.posterPath}"
                     th:alt="${tmdbMovie.title}"
                     class="img-fluid rounded shadow"/>
            </div>

            <!-- infos -->
            <div class="col-md-9">
                <h1 class="fw-bold" th:text="${tmdbMovie.title}"></h1>

                <div class="d-flex gap-3 text-muted mb-3">
          <span class="badge bg-dark fs-6" th:if="${tmdbMovie.releaseDate}">
            <span th:text="${tmdbMovie.releaseDate}"></span>
          </span>
          <span  class="badge bg-light text-dark border fs-6" th:if="${tmdbMovie.runtime != null and tmdbMovie.runtime > 0}">
                        <i class="bi bi-clock"></i>
            <span th:text="${tmdbMovie.runtime + ' min'}"></span>
          </span>
                    <span class="badge bg-warning fs-6"th:if="${tmdbMovie.genres != null and not #lists.isEmpty(tmdbMovie.genres)}">
            <span th:text="${tmdbMovie.genres[0].name}"></span>
          </span>
                </div>

                <p class="lead" th:text="${tmdbMovie.overview}"></p>

                <!-- trailer -->
                <div th:if="${trailerUrl != null}" class="ratio ratio-16x9 mt-3 mb-4" style="max-width:560px;">
                    <iframe th:src="${trailerUrl}" allowfullscreen></iframe>
                </div>

                <!--^pas encore importé -->
                <div class="alert alert-info mt-3">
                    <strong>Ce film n'est pas encore programmé dans nos cinémas.</strong><br/>
                    Revenez prochainement pour découvrir les séances disponibles.
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
