<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title th:text="${tmdbMovie.title} + ' – Distopia'">
        Film – Distopia
    </title>
</head>

<section layout:fragment="content">

    <div class="container py-4"
         th:if="${tmdbMovie != null}">

        <!-- bouton retour -->
        <a href="/"
           class="btn btn-outline-danger btn-sm mb-4 rounded-pill px-3">
            <i class="bi bi-arrow-left"></i> Retour
        </a>

        <div class="row g-4 align-items-start">

            <!-- affiche film -->
            <div class="col-md-3">

                <img th:src="${tmdbMovie.posterPath != null ? imgBase + tmdbMovie.posterPath : '/images/no-poster.jpg'}"
                     th:alt="${tmdbMovie.title}"
                     class="img-fluid rounded-4 shadow-lg movie-poster"
                     onerror="this.src='/images/no-poster.jpg'"/>
            </div>

            <!-- infos film -->
            <div class="col-md-9">

                <!-- titre -->
                <h1 class="fw-bold mb-3"
                    th:text="${tmdbMovie.title}">
                    Movie title
                </h1>

                <!-- badges -->
                <div class="d-flex flex-wrap gap-2 mb-4">
                    <!-- date -->
                    <span class="badge bg-dark fs-6 px-3 py-2"
                          th:if="${tmdbMovie.releaseDate}">
                        <i class="bi bi-calendar3 me-1"></i>
                        <span th:text="${tmdbMovie.releaseDate}"></span>
                    </span>

                    <!-- durée -->
                    <span class="badge bg-light text-dark border fs-6 px-3 py-2"
                          th:if="${tmdbMovie.runtime != null and tmdbMovie.runtime > 0}">
                        <i class="bi bi-clock me-1"></i>
                        <span th:text="${tmdbMovie.runtime + ' min'}"></span>
                    </span>

                    <!-- genres -->
                    <span class="badge bg-warning text-dark fs-6 px-3 py-2"
                          th:if="${tmdbMovie.genres != null and not #lists.isEmpty(tmdbMovie.genres)}">
                        <span th:text="${#strings.listJoin(tmdbMovie.genres.![name], ', ')}"></span>
                    </span>
                </div>

                <!-- synopsis -->
                <p class="lead movie-overview"
                   th:text="${tmdbMovie.overview}">
                    Synopsis du film
                </p>

                <!-- fallback synopsis -->
                <div class="alert alert-secondary"
                     th:if="${tmdbMovie.overview == null or tmdbMovie.overview.isBlank()}">
                    Aucun synopsis disponible pour ce film
                </div>

                <!-- trailer -->
                <div th:if="${trailerUrl != null}"
                     class="ratio ratio-16x9 mt-4 mb-4 trailer-container">
                    <iframe th:src="${trailerUrl}"
                            allowfullscreen
                            class="rounded-4 shadow">
                    </iframe>
                </div>

                <!-- film non programmé -->
                <div class="alert alert-info border-0 shadow-sm rounded-4 mt-4">
                    <strong>
                        Ce film n'est pas encore programmé dans nos cinémas.
                    </strong>
                    <br/>
                    Revenez prochainement pour découvrir les séances disponibles.
                </div>
            </div>
        </div>
    </div>
</section>

</html>
</html>
